<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Tic Tac Toe</h1>
        
        <div class="game-mode">
            <button id="twoPlayerMode" class="mode-btn active">2 Players</button>
            <button id="computerMode" class="mode-btn">vs Computer</button>
        </div>

        <div class="players">
            <div class="player player-x active">Player X</div>
            <div class="player player-o">Player O</div>
        </div>

        <div class="board" id="board">
            <div class="cell" data-cell></div>
            <div class="cell" data-cell></div>
            <div class="cell" data-cell></div>
            <div class="cell" data-cell></div>
            <div class="cell" data-cell></div>
            <div class="cell" data-cell></div>
            <div class="cell" data-cell></div>
            <div class="cell" data-cell></div>
            <div class="cell" data-cell></div>
        </div>

        <div class="winning-message" id="winningMessage">
            <div id="winningMessageText"></div>
            <button id="restartButton">Restart Game</button>
        </div>

        <div class="score-board">
            <div class="score">
                <span>X Score: </span>
                <span id="xScore">0</span>
            </div>
            <div class="score">
                <span>O Score: </span>
                <span id="oScore">0</span>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
